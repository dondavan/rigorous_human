<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rigorous Human</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #e2e8f0;
      }

      main {
        width: min(680px, calc(100% - 2rem));
        padding: 2rem;
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.82);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      p, li {
        line-height: 1.6;
      }

      code {
        padding: 0.15rem 0.4rem;
        border-radius: 6px;
        background: rgba(148, 163, 184, 0.18);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Node.js template ready</h1>
      <p>This starter app is set up to run behind Apache, with Node listening locally and Apache handling public HTTPS traffic on port 443.</p>
      <ul>
        <li>Health check: <code>/health</code></li>
        <li>Sample API route: <code>/api/hello</code></li>
        <li>Static assets served from <code>public/</code></li>
      </ul>
    </main>
  </body>
</html>
